name: Notion Docs Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Notion Markdown exporter
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Sync Notion pages
        env:
          NOTION_TOKEN: \${{ secrets.NOTION_TOKEN }}
        run: python .github/scripts/sync_notion_docs.py
      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          branch: docs-sync/notion
          base: develop
          delete-branch: false
          commit-message: "docs: sync V1 specifications from Notion"
          title: "docs: sync V1 specifications from Notion"
          body: |
            Automated snapshots of approved V1 Notion specifications.
            - Generated files only; do not edit manually.
            - Review diffs before merging.
            - Not auto-merged.
          add-paths: |
            docs/notion/V1_RELEASE_SCOPE.md
            docs/notion/V1_FUNCTIONAL_REQUIREMENTS.md
            docs/notion/V1_DEVELOPMENT_PLAN.md
